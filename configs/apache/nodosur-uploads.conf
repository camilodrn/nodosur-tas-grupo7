# Nodo Sur E3 — Proteccion Apache instalada en web1 y web2 (21/10/2026).
# Origen root-owned: /etc/nodosur/apache/nodosur-uploads.conf en cada VM web.
# Compose monta este archivo de solo lectura; no contiene credenciales.
# Pruebas registradas en evidencias/e3/apache-uploads-web1-web2-final-20261021.txt.
# E3: el contenido compartido subido por usuarios nunca debe ejecutar PHP/CGI.
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    Options -ExecCGI -Indexes
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
