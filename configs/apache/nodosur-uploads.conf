# Nodo Sur E3 — PROTECCION PROPUESTA, NO INSTALADA EN LAS VMS.
# Debe validarse en Apache aislado y desplegarse con aprobacion y rollback.
# Previene que archivos potencialmente ejecutables se sirvan como codigo.
# E3: el contenido compartido subido por usuarios nunca debe ejecutar PHP/CGI.
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    Options -ExecCGI -Indexes
    <FilesMatch "\.(?i:php[0-9]?|phtml|phar)(?:\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
