# Configuracion de laboratorio: SOLO HTTP loopback, sin TLS.
# No reemplaza compose/proxy/haproxy.prod.cfg.
global
    log stdout format raw local0
    maxconn 200

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend lab_http
    bind *:8080
    default_backend lab_wordpress

backend lab_wordpress
    balance roundrobin
    http-response set-header X-NodoSur-Lab-Backend %[srv_name]

    # Antes de instalar WordPress, la portada puede redirigir (302).
    # Aceptamos 200 o 302 SOLO para inicializar el entorno aislado.
    option httpchk
    http-check send meth GET uri / ver HTTP/1.1 hdr Host 127.0.0.1:19090
    http-check expect rstatus ^(200|302)$

    server web1 web1:80 check inter 3s fall 3 rise 2
    server web2 web2:80 check inter 3s fall 3 rise 2
