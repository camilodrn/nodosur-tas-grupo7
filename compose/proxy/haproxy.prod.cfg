global
    log stdout format raw local0
    maxconn 1000

defaults
    log global
    mode http
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend frontend_web
    # E4 - Trazabilidad de solicitudes
    unique-id-format %[uuid(7)]
    unique-id-header X-Request-ID
    http-response set-header X-Request-ID %[unique-id]
    log-format "%ci:%cp [%tr] %ft %b/%s %TR/%Tw/%Tc/%Tr/%Ta %ST %B %CC %CS %tsc %ac/%fc/%bc/%sc/%rc %sq/%bq rid=%ID \"%r\""
    bind *:8080
    bind *:8443 ssl crt /usr/local/etc/haproxy/certs/haproxy.pem

    # Encabezado temporal para validar el flujo HTTPS interno.
    # Se sustituirá por la detección TLS real en el frontend final.
    http-request del-header X-Forwarded-Proto
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http unless { ssl_fc }

    http-request redirect scheme https code 301 unless { ssl_fc }

    # E4 - Acceso a Grafana por HTTPS
    acl ruta_grafana path -i /grafana
    acl ruta_grafana_sub path_beg -i /grafana/
    use_backend backend_grafana if ruta_grafana || ruta_grafana_sub

    default_backend backend_wordpress

backend backend_wordpress
    balance roundrobin
    http-response set-header X-NodoSur-Backend %[srv_name]

    option httpchk
    http-check send meth HEAD uri / ver HTTP/1.1 hdr Host nodosur07.tas hdr X-Forwarded-Proto https
    http-check expect status 200

    server web1 10.33.199.58:18081 check inter 3s fall 3 rise 2
    server web2 10.33.199.62:18080 check inter 3s fall 3 rise 2

backend backend_grafana
    server grafana grafana:3000 check inter 5s fall 3 rise 2

frontend prometheus_metrics
    bind *:8405
    mode http
    http-request use-service prometheus-exporter if { path /metrics }
    no log
