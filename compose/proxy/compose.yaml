name: nodosur-proxy

services:
  haproxy:
    image: haproxy:3.2.23-alpine
    container_name: nodosur-haproxy
    restart: unless-stopped

    ports:
      - "127.0.0.1:18088:8080"

    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
