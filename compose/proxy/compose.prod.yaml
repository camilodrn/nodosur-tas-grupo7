name: nodosur-proxy

services:
  haproxy:
    image: haproxy:3.2.23-alpine
    container_name: nodosur-haproxy
    restart: "no"

    ports:
      - "10.33.195.194:80:8080"
      - "10.33.195.194:443:8443"

    volumes:
      - type: bind
        source: ./haproxy.prod.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/nodosur/tls/haproxy-www.pem
        target: /usr/local/etc/haproxy/certs/haproxy.pem
        read_only: true
        bind:
          create_host_path: false

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
